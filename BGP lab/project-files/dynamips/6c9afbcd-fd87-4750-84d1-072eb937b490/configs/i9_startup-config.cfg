!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R9
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
!
!
ip cef
no ip domain lookup
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface Loopback10
 ip address 10.10.10.9 255.255.255.255
!
interface Loopback150
 ip address 150.1.1.9 255.255.255.255
!
interface FastEthernet0/0
 ip address 192.168.79.1 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet0/1
 ip address 192.168.89.1 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet1/0
 ip address 192.168.119.1 255.255.255.252
 duplex auto
 speed auto
!
!
router eigrp 10
 network 10.10.10.9 0.0.0.0
 network 192.168.79.0 0.0.0.3
 network 192.168.89.0 0.0.0.3
 network 192.168.119.0 0.0.0.3
 no auto-summary
!
router bgp 2000
 no synchronization
 bgp log-neighbor-changes
 network 150.1.1.9 mask 255.255.255.255
 neighbor TEST2 peer-group
 neighbor TEST2 remote-as 2000
 neighbor TEST2 password 123
 neighbor TEST2 update-source Loopback10
 neighbor TEST2 route-reflector-client
 neighbor TEST2 next-hop-self
 neighbor 10.10.10.7 peer-group TEST2
 neighbor 10.10.10.8 peer-group TEST2
 neighbor 192.168.119.2 remote-as 110
 no auto-summary
!
no ip http server
no ip http secure-server
ip forward-protocol nd
!
!
!
no cdp log mismatch duplex
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
