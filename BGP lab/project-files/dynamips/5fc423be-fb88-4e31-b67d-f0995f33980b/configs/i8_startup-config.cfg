!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R8
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
!
!
ip cef
no ip domain lookup
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface Loopback10
 ip address 10.10.10.8 255.255.255.255
!
interface Loopback150
 ip address 150.1.1.8 255.255.255.255
!
interface FastEthernet0/0
 ip address 192.168.48.2 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet0/1
 ip address 192.168.89.2 255.255.255.252
 duplex auto
 speed auto
!
!
router eigrp 10
 network 10.10.10.8 0.0.0.0
 network 192.168.48.0 0.0.0.3
 network 192.168.89.0 0.0.0.3
 no auto-summary
!
router bgp 2000
 no synchronization
 bgp log-neighbor-changes
 network 150.1.1.8 mask 255.255.255.255
 neighbor 10.10.10.9 remote-as 2000
 neighbor 10.10.10.9 password 123
 neighbor 10.10.10.9 update-source Loopback10
 neighbor 10.10.10.9 next-hop-self
 neighbor 192.168.48.1 remote-as 1000
 no auto-summary
!
no ip http server
no ip http secure-server
ip forward-protocol nd
!
!
!
no cdp log mismatch duplex
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
