!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R4
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
!
!
ip cef
no ip domain lookup
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface Loopback10
 ip address 10.10.10.4 255.255.255.255
!
interface Loopback150
 ip address 150.1.1.4 255.255.255.255
!
interface FastEthernet0/0
 ip address 192.168.24.1 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet0/1
 ip address 192.168.34.1 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet1/0
 ip address 192.168.47.1 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet2/0
 ip address 192.168.48.1 255.255.255.252
 duplex auto
 speed auto
!
!
router ospf 1
 log-adjacency-changes
 network 10.10.10.6 0.0.0.0 area 0
 network 192.168.36.0 0.0.0.3 area 0
!
router bgp 1000
 no synchronization
 bgp log-neighbor-changes
 network 150.1.1.4 mask 255.255.255.255
 neighbor 10.10.10.3 remote-as 1000
 neighbor 10.10.10.3 password 123
 neighbor 10.10.10.3 update-source Loopback10
 neighbor 10.10.10.3 next-hop-self
 neighbor 192.168.24.2 remote-as 12
 neighbor 192.168.47.2 remote-as 2000
 neighbor 192.168.48.2 remote-as 2000
 no auto-summary
!
no ip http server
no ip http secure-server
ip forward-protocol nd
ip route 10.10.10.3 255.255.255.255 192.168.34.2
ip route 10.10.10.5 255.255.255.255 192.168.34.2
ip route 192.168.35.0 255.255.255.252 192.168.34.2
!
!
!
no cdp log mismatch duplex
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
