!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R5
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
!
!
ip cef
no ip domain lookup
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface Loopback10
 ip address 10.10.10.5 255.255.255.255
!
interface Loopback150
 ip address 150.1.1.5 255.255.255.255
!
interface FastEthernet0/0
 ip address 192.168.35.1 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet0/1
 no ip address
 shutdown
 duplex auto
 speed auto
!
!
router bgp 1000
 no synchronization
 bgp log-neighbor-changes
 network 150.1.1.5 mask 255.255.255.255
 neighbor 10.10.10.3 remote-as 1000
 neighbor 10.10.10.3 password 123
 neighbor 10.10.10.3 update-source Loopback10
 neighbor 10.10.10.3 next-hop-self
 no auto-summary
!
no ip http server
no ip http secure-server
ip forward-protocol nd
ip route 10.10.10.3 255.255.255.255 192.168.35.2
ip route 10.10.10.4 255.255.255.255 192.168.35.2
ip route 192.168.34.0 255.255.255.252 192.168.35.2
!
!
!
no cdp log mismatch duplex
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
