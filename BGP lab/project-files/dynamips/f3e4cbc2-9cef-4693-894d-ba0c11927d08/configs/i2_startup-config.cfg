!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R2
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
!
!
ip cef
no ip domain lookup
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface Loopback10
 ip address 10.10.10.2 255.255.255.255
!
interface Loopback150
 ip address 150.1.1.2 255.255.255.255
!
interface FastEthernet0/0
 ip address 192.168.102.2 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet0/1
 ip address 192.168.12.2 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet1/0
 ip address 192.168.24.2 255.255.255.252
 duplex auto
 speed auto
!
!
router eigrp 12
 network 10.10.10.2 0.0.0.0
 network 192.168.12.0 0.0.0.3
 network 192.168.24.0 0.0.0.3
 network 192.168.102.0 0.0.0.3
 no auto-summary
!
router bgp 12
 no synchronization
 bgp log-neighbor-changes
 network 150.1.1.2 mask 255.255.255.255
 neighbor 10.10.10.1 remote-as 12
 neighbor 10.10.10.1 password 123
 neighbor 10.10.10.1 update-source Loopback10
 neighbor 10.10.10.1 next-hop-self
 neighbor 192.168.24.1 remote-as 1000
 neighbor 192.168.102.1 remote-as 100
 no auto-summary
!
no ip http server
no ip http secure-server
ip forward-protocol nd
!
!
!
no cdp log mismatch duplex
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
