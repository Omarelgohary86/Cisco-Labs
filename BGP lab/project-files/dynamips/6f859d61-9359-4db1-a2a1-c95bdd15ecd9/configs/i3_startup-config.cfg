!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R3
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
!
!
ip cef
no ip domain lookup
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface Loopback10
 ip address 10.10.10.3 255.255.255.255
!
interface Loopback150
 ip address 150.1.1.3 255.255.255.255
!
interface FastEthernet0/0
 ip address 192.168.13.2 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet0/1
 ip address 192.168.34.2 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet1/0
 ip address 192.168.36.2 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet2/0
 ip address 192.168.35.2 255.255.255.252
 duplex auto
 speed auto
!
!
router ospf 1
 log-adjacency-changes
 redistribute connected subnets
 redistribute static subnets
 redistribute bgp 1000
 network 10.10.10.3 0.0.0.0 area 0
 network 150.1.1.3 0.0.0.0 area 0
 network 192.168.36.0 0.0.0.3 area 0
 default-information originate always
!
router bgp 1000
 no synchronization
 bgp log-neighbor-changes
 bgp redistribute-internal
 network 150.1.1.3 mask 255.255.255.255
 redistribute ospf 1
 neighbor TEST peer-group
 neighbor TEST remote-as 1000
 neighbor TEST password 123
 neighbor TEST update-source Loopback10
 neighbor TEST route-reflector-client
 neighbor TEST next-hop-self
 neighbor 10.10.10.4 peer-group TEST
 neighbor 10.10.10.5 peer-group TEST
 neighbor 192.168.13.1 remote-as 12
 no auto-summary
!
no ip http server
no ip http secure-server
ip forward-protocol nd
ip route 10.10.10.4 255.255.255.255 192.168.34.1
ip route 10.10.10.5 255.255.255.255 192.168.35.1
!
!
!
no cdp log mismatch duplex
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
